# ~/.config/kitty/kitty.conf
# Black + Crimson, macOS, заточка под SSH и консольную работу
# Важно: комментарии только на отдельных строках, не в конце строки с опцией

# ---------- Шрифт ----------
font_family      Menlo
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Межстрочный интервал (замена устаревшего adjust_line_height)
modify_font cell_height 110%

# Иконки Nerd Font поверх Menlo (для starship, eza, nvim)
# Нужен шрифт: brew install --cask font-symbols-only-nerd-font
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono

# ---------- macOS ----------
# Option работает как Alt (nano, vim, tmux)
macos_option_as_alt yes
# Титлбар в цвет фона
macos_titlebar_color background
macos_quit_when_last_window_closed yes
# Размытие под прозрачностью
background_blur 20

# ---------- Курсор ----------
cursor_shape       block
cursor_blink_interval 0
# Плавный "хвост" за курсором
cursor_trail        1
cursor_trail_decay  0.05 0.15

# ---------- Задержки ----------
input_delay      0
repaint_delay    2
sync_to_monitor  no

# ---------- Scrollback ----------
scrollback_lines    20000
wheel_scroll_multiplier 3.0

# ---------- Окна ----------
enabled_layouts     splits,stack,tall,fat,grid
window_padding_width 6
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.7

# ---------- Буфер обмена ----------
copy_on_select        yes
strip_trailing_spaces  smart
# Спросит подтверждение при вставке многострочного текста
paste_actions quote-urls-at-prompt,confirm
map ctrl+shift+v       paste_from_clipboard
map ctrl+shift+c       copy_to_clipboard

# ---------- Shell integration ----------
shell_integration enabled
map ctrl+shift+up      scroll_to_prompt -1
map ctrl+shift+down    scroll_to_prompt 1
map ctrl+shift+g       show_last_command_output

# ---------- Сплиты, окна, вкладки ----------
map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+z          toggle_layout stack
map ctrl+shift+t          new_tab_with_cwd
map ctrl+shift+w          close_window
map ctrl+shift+right      next_tab
map ctrl+shift+left       previous_tab
map ctrl+shift+]          next_window
map ctrl+shift+[          previous_window
map ctrl+shift+e          open_url_with_hints

# ---------- Прочее ----------
confirm_os_window_close  0
enable_audio_bell         no
remember_window_size      yes
update_check_interval     0

# ---------- Тема: Black + Crimson ----------
foreground            #e6e6e6
background            #000000
background_opacity    0.97
selection_foreground  #000000
selection_background  #e81c5a

cursor            #e81c5a
cursor_text_color #000000

url_color #e81c5a
url_style curly

# black
color0  #1a1a1a
color8  #555555
# red
color1  #ff5c57
color9  #ff8a85
# green
color2  #5af78e
color10 #8effb0
# yellow
color3  #f3f99d
color11 #ffffb0
# blue
color4  #9aedfe
color12 #b8f4ff
# magenta / crimson: акцентный цвет путей и заголовков
color5  #e81c5a
color13 #ff5c85
# cyan
color6  #9aedfe
color14 #c0f8ff
# white
color7  #e6e6e6
color15 #ffffff

active_border_color   #e81c5a
inactive_border_color #333333

# ---------- Вкладки ----------
tab_bar_style         fade
tab_bar_edge          top
tab_title_template    "{index}: {title}"
tab_bar_background      #000000
active_tab_background   #000000
active_tab_foreground   #e81c5a
inactive_tab_background #000000
inactive_tab_foreground #555555
